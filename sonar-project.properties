sonar.projectKey=oe-mirrors_e2iplayer-deps
sonar.organization=oe-mirrors

# C only. The vendored trees (expat, VLC, ffmpeg snippets, librtmp) are
# upstream code and not ours to fix - keep them out of the analysis.
sonar.sources=hlsdl/src,cmdwrap/src,lsdir/src,e2isubparser/src
sonar.exclusions=e2isubparser/src/expat-2.2.0/**,e2isubparser/src/vlc/**,e2isubparser/src/ffmpeg/**,e2isubparser/src/ttml/**,e2isubparser/src/html/**,f4mdump/**,hlsdl/msvc/**

sonar.cfamily.build-wrapper-output=bw-output
sonar.c.file.suffixes=.c,.h
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

sonar.sourceEncoding=UTF-8
