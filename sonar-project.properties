sonar.projectKey=oe-mirrors_e2iplayer-deps
sonar.organization=oe-mirrors-1

# C only. Only genuinely pristine vendored code is excluded (the Expat
# copy). The VLC / FFmpeg subtitle snippets under e2isubparser/src were
# forked and are maintained here - a heap overflow was fixed in one of
# them - so they stay in the analysis.
sonar.sources=hlsdl/src,cmdwrap/src,lsdir/src,e2isubparser/src
sonar.exclusions=e2isubparser/src/expat-2.2.0/**

sonar.cfamily.build-wrapper-output=bw-output
sonar.c.file.suffixes=.c,.h
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

sonar.sourceEncoding=UTF-8
