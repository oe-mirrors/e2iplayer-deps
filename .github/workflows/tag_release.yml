name: Tag on version change

# Each component carries its own version string in source. On every push to
# master this tags <component>-v<version> when that tag does not exist yet,
# so `git describe` and the README version badges track real versions.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hlsdl
            file: hlsdl/src/misc.c
            regex: 'hlsdl v\K[0-9]+(\.[0-9]+)+'
          - name: lsdir
            file: lsdir/src/lsdir.c
            regex: 'LSDIR_VERSION "\K[0-9]+(\.[0-9]+)+'
          - name: cmdwrap
            file: cmdwrap/src/cmdwrap.c
            regex: 'Version: \K[0-9]+(\.[0-9]+)*'
          - name: e2isubparser
            file: e2isubparser/src/subparsermodule.c
            regex: 'SUB_PARSER_VERSION\[\] = "\K[0-9]+(\.[0-9]+)+'
          - name: f4mdump
            file: f4mdump/src/main.cpp
            regex: 'F4MDump v\K[0-9]+(\.[0-9]+)+'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag ${{ matrix.name }}
        run: |
          V=$(grep -oP '${{ matrix.regex }}' '${{ matrix.file }}' | head -n1)
          test -n "$V"
          TAG="${{ matrix.name }}-v$V"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "$TAG already exists - nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "created $TAG"
