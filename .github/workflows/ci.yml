          # 200 with the whole file, which must not be written as the init segment
          range_code=$(curl -s -o /dev/null -w '%{http_code}' -r 0-1 http://127.0.0.1:8200/blob.mp4)
          rc_sf=0
          timeout 60 ../hlsdl/hlsdl -f -w 0 -o out_sf_http.mp4 "http://127.0.0.1:8200/sf.m3u8" 2>sf_http.log || rc_sf=$?
