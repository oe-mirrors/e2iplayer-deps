          # ("Which Language should be downloaded?") and hang or exit 1
          printf '#EXTM3U\n#EXT-X-MEDIA:TYPE=AUDIO,GROUP-ID="a",NAME="Deutsch",LANGUAGE="de",URI="aplaylist.m3u8"\n#EXT-X-MEDIA:TYPE=AUDIO,GROUP-ID="a",NAME="English",LANGUAGE="en",URI="does-not-exist.m3u8"\n#EXT-X-STREAM-INF:BANDWIDTH=300000,AUDIO="a"\nvplaylist.m3u8\n' > sel_master.m3u8
