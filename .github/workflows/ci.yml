          : > empty.ts
          { printf "$hdr"; printf '#EXTINF:1.0,\nrk0.ts\n#EXTINF:1.0,\nempty.ts\n#EXTINF:1.0,\nrk2.ts\n#EXT-X-ENDLIST\n'; } > empty.m3u8
