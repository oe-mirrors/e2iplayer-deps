          test ! -s qq.log
      - name: fixture - -I skips a segment that cannot be fetched
        run: |
          set -eux
          cd fx
          hdr='#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:1\n#EXT-X-MEDIA-SEQUENCE:0\n'
          { printf "$hdr"; printf '#EXTINF:1.0,\nrk0.ts\n#EXTINF:1.0,\nmissing.ts\n#EXTINF:1.0,\nrk2.ts\n#EXT-X-ENDLIST\n'; } > gap.m3u8
          { printf "$hdr"; printf '#EXTINF:1.0,\nrk0.ts\n#EXTINF:1.0,\nrk2.ts\n#EXT-X-ENDLIST\n'; } > gap_ref.m3u8
          timeout 60 ../hlsdl/hlsdl -f -o ref_gap.ts gap_ref.m3u8
          # without -I the gap fails the download, with -I it is left out
          if timeout 60 ../hlsdl/hlsdl -f -w 0 -o out_gap.ts gap.m3u8; then
            echo "expected the download with a missing segment to fail" >&2; exit 1
          fi
          timeout 60 ../hlsdl/hlsdl -f -w 0 -I -o out_gap.ts gap.m3u8 2>gap.log
          cat gap.log
          grep -q '1 of 3 segments were skipped' gap.log
          cmp out_gap.ts ref_gap.ts
          # nothing fetched at all is still a failure
          { printf "$hdr"; printf '#EXTINF:1.0,\nmissing.ts\n#EXT-X-ENDLIST\n'; } > allgap.m3u8
          if timeout 60 ../hlsdl/hlsdl -f -w 0 -I -o out_allgap.ts allgap.m3u8; then
            echo "-I reported success although no segment was downloaded" >&2; exit 1
          fi
