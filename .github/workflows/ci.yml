          import http.server
          hits = {'n': 0}
          class H(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  if self.path.startswith('/flaky.key'):
                      hits['n'] += 1
                      if hits['n'] == 1:
                          self.send_error(503)
                          return
                      self.path = '/k1.key'
                  return super().do_GET()
          http.server.ThreadingHTTPServer(('127.0.0.1', 8207), H).serve_forever()
