name: build deps

on: [push, pull_request]

jobs:
  # ------------------------------------------------------------------ hlsdl
  # Linux only - the deps feed is always cross-compiled for Linux and the
  # bundled makefile has no macOS openssl handling.
  hlsdl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: install deps
        run: sudo apt-get update && sudo apt-get -y install libcurl4-openssl-dev libssl-dev ffmpeg
      - name: make
        run: make -C hlsdl
      - name: TS stream (AES-128, muxed)
        run: |
          timeout 180 ./hlsdl/hlsdl -b -o test.ts "https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_4x3/bipbop_4x3_variant.m3u8"
          echo "6bf11a9a4be02443d4790e43e6569a614128bad453c5cb327ec74031f6ea6382  test.ts" | sha256sum -c
      # Needs the current hlsdl (EXT-X-MAP support). Against the old bundled
      # 0.26 this step fails - that is the point.
      - name: fMP4 stream (EXT-X-MAP + BYTERANGE)
        run: |
          set -eux
          # the -b variant (v9) carries #EXT-X-MAP:URI="main.mp4",BYTERANGE="721@0"
          # into a ~585 MB progressive file; a broken quote-skip makes hlsdl pull
          # that whole file in as the "init segment" AND append the byte ranges.
          timeout 300 ./hlsdl/hlsdl -b -o test_fmp4.mp4 "https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8"
          test -s test_fmp4.mp4
          dd if=test_fmp4.mp4 bs=1 skip=4 count=4 2>/dev/null | grep -q ftyp
          bytes=$(stat -c%s test_fmp4.mp4)
          test "$bytes" -gt 50000000
          test "$bytes" -lt 800000000
          # ffprobe reads the whole file; -b takes the audio rendition of the
          # variant, and fMP4 + separate audio is muxed into one file with both
          # tracks (v0.37) - before, the output had no sound
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 test_fmp4.mp4 > streams.txt
          cat streams.txt
          grep -qE '^video' streams.txt
          grep -qE '^audio' streams.txt
          apk=$(ffprobe -v error -select_streams a -count_packets -show_entries stream=nb_read_packets -of csv=p=0 test_fmp4.mp4 | head -1 | cut -d, -f1)
          test "$apk" -gt 1000
      # Locally generated fixtures - deterministic, no network. Split into one
      # step per case so a failure points straight at the fixture that broke.
      - name: fixture - fMP4 EXT-X-MAP (separate init file)
        run: |
          set -eux
          mkdir fx && cd fx
          ffmpeg -v error -f lavfi -i testsrc=d=6:s=128x72 -c:v libx264 -g 15 \
                 -f hls -hls_time 2 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_type fmp4 -hls_fmp4_init_filename init.mp4 fmp4.m3u8
          cat fmp4.m3u8
          timeout 60 ../hlsdl/hlsdl -f -o out_fmp4.mp4 fmp4.m3u8
          dd if=out_fmp4.mp4 bs=1 skip=4 count=4 2>/dev/null | grep -q ftyp
          test "$(grep -a -o ftyp out_fmp4.mp4 | wc -l)" -eq 1
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 out_fmp4.mp4 | grep -q video
      - name: fixture - single-file fMP4 (EXT-X-MAP BYTERANGE, local path)
        run: |
          set -eux
          cd fx
          # concat the init + fragments into one file and hand-write a byte-range
          # playlist: #EXT-X-MAP:URI="blob.mp4",BYTERANGE="<n>@0" (quoted, unlike
          # #EXT-X-BYTERANGE). A broken quote-skip reads size 0 -> local 404.
          segs=$(grep -v '^#' fmp4.m3u8)
          cat init.mp4 $segs > blob.mp4
          isz=$(stat -c%s init.mp4)
          {
            printf '#EXTM3U\n#EXT-X-VERSION:7\n#EXT-X-TARGETDURATION:2\n#EXT-X-MEDIA-SEQUENCE:0\n#EXT-X-PLAYLIST-TYPE:VOD\n'
            printf '#EXT-X-MAP:URI="blob.mp4",BYTERANGE="%d@0"\n' "$isz"
            off=$isz
            for s in $segs; do
              sz=$(stat -c%s "$s")
              printf '#EXTINF:1.0,\n#EXT-X-BYTERANGE:%d@%d\nblob.mp4\n' "$sz" "$off"
              off=$((off + sz))
            done
            printf '#EXT-X-ENDLIST\n'
          } > sf.m3u8
          cat sf.m3u8
          timeout 60 ../hlsdl/hlsdl -f -o out_sf.mp4 sf.m3u8
          dd if=out_sf.mp4 bs=1 skip=4 count=4 2>/dev/null | grep -q ftyp
          # hlsdl just re-reads the byte ranges in order -> exactly blob.mp4
          cmp -s out_sf.mp4 blob.mp4
      - name: fixture - live fMP4, -s 0 keeps the EXT-X-MAP
        run: |
          set -eux
          cd fx
          # a live playlist (no ENDLIST); 2 s segments so -i 1 stops hlsdl
          # cleanly (exit 0, file flushed) right after the first trimmed
          # segment instead of spinning until a timeout kill
          sed '/#EXT-X-ENDLIST/d;/#EXT-X-PLAYLIST-TYPE/d' fmp4.m3u8 > live_fmp4.m3u8
          cat live_fmp4.m3u8
          python3 -m http.server 8199 &
          srv=$!
          sleep 1
          timeout 30 ../hlsdl/hlsdl -f -s 0 -i 1 -e 1 -o out_live_fmp4.mp4 "http://127.0.0.1:8199/live_fmp4.m3u8" || true
          kill $srv 2>/dev/null || true
          ls -l out_live_fmp4.mp4
          # -i 1 stops hlsdl right after the init segment, before the first
          # trimmed media segment is written -> the output must be exactly the
          # EXT-X-MAP init. A broken trim frees that head and the output starts
          # with a media fragment (styp / no ftyp) instead.
          dd if=out_live_fmp4.mp4 bs=1 skip=4 count=4 2>/dev/null | grep -q ftyp
          cmp -s out_live_fmp4.mp4 init.mp4
      - name: fixture - repeated and changing EXT-X-MAP (VOD, live refresh, live -s trim)
        run: |
          set -eux
          cd fx
          segs=$(grep -v '^#' fmp4.m3u8)
          test "$(echo $segs | wc -w)" -ge 2
          s0=$(echo $segs | cut -d' ' -f1)
          hdr7='#EXTM3U\n#EXT-X-VERSION:7\n#EXT-X-TARGETDURATION:2\n#EXT-X-MEDIA-SEQUENCE:0\n'
          # VOD: the map repeated before every segment, once under another URL
          # with the same bytes - the init must be in the file exactly once
          cp init.mp4 init_copy.mp4
          {
            printf "$hdr7"
            n=0
            for s in $segs; do
              if [ $n -eq 1 ]; then
                printf '#EXT-X-DISCONTINUITY\n#EXT-X-MAP:URI="init_copy.mp4"\n'
              else
                printf '#EXT-X-MAP:URI="init.mp4"\n'
              fi
              printf '#EXTINF:2.0,\n%s\n' "$s"
              n=$((n + 1))
            done
            printf '#EXT-X-ENDLIST\n'
          } > rep.m3u8
          cat rep.m3u8
          timeout 60 ../hlsdl/hlsdl -f -o out_rep.mp4 rep.m3u8
          cmp out_rep.mp4 out_fmp4.mp4
          # a second, different init
          ffmpeg -v error -f lavfi -i testsrc2=d=4:s=96x64 -c:v libx264 -g 15 \
                 -f hls -hls_time 2 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_type fmp4 -hls_fmp4_init_filename init2.mp4 \
                 -hls_segment_filename 'b%d.m4s' fmp4b.m3u8
          ! cmp -s init.mp4 init2.mp4
          b0=$(grep -v '^#' fmp4b.m3u8 | sed -n 1p)
          b1=$(grep -v '^#' fmp4b.m3u8 | sed -n 2p)
          test -n "$b1"
          python3 -m http.server 8201 &
          srv=$!
          printf "$hdr7" > live_map.m3u8
          printf '#EXT-X-MAP:URI="init.mp4"\n#EXTINF:2.0,\n%s\n' "$s0" >> live_map.m3u8
          for _ in $(seq 20); do
            curl -sf -o /dev/null http://127.0.0.1:8201/live_map.m3u8 && break
            sleep 0.5
          done
          # live: a new init after a discontinuity, right in front of the new
          # segment - the refresh used to drop it
          timeout 30 ../hlsdl/hlsdl -f -s 30 -e 1 -o out_live_map.mp4 "http://127.0.0.1:8201/live_map.m3u8" 2>live_map.log &
          dl=$!
          # change the playlist only once hlsdl is through the first window
          for _ in $(seq 40); do
            grep -q 'Downloading part 0' live_map.log && break
            sleep 0.5
          done
          sleep 1
          printf '#EXT-X-DISCONTINUITY\n#EXT-X-MAP:URI="init2.mp4"\n#EXTINF:2.0,\n%s\n#EXT-X-ENDLIST\n' "$b0" >> live_map.m3u8
          rc=0
          wait $dl || rc=$?
          # live -s: the window holds two inits and the start lies after the
          # second - the trim used to keep the first one. The start is at least
          # three target durations before the end (v0.37): TARGETDURATION:1 puts
          # it at b0, after the second init.
          {
            printf "$hdr7" | sed 's/TARGETDURATION:2/TARGETDURATION:1/'
            printf '#EXT-X-MAP:URI="init.mp4"\n#EXTINF:2.0,\n%s\n' "$s0"
            printf '#EXT-X-DISCONTINUITY\n#EXT-X-MAP:URI="init2.mp4"\n#EXTINF:2.0,\n%s\n#EXTINF:2.0,\n%s\n' "$b0" "$b1"
          } > live_trim.m3u8
          # -i 1 stops right after the init in force at the start
          timeout 30 ../hlsdl/hlsdl -f -s 1 -i 1 -e 1 -o out_live_trim.mp4 "http://127.0.0.1:8201/live_trim.m3u8" || true
          kill $srv 2>/dev/null || true
          test "$rc" -eq 0
          cat init.mp4 "$s0" init2.mp4 "$b0" > ref_live_map.mp4
          cmp out_live_map.mp4 ref_live_map.mp4
          cmp out_live_trim.mp4 init2.mp4
      - name: fixture - TS with a mid-stream EXT-X-DISCONTINUITY
        run: |
          set -eux
          cd fx
          ffmpeg -v error -f lavfi -i testsrc=d=1:s=128x72 -c:v mpeg2video -f mpegts d0.ts
          ffmpeg -v error -f lavfi -i testsrc=d=1:s=128x72 -c:v mpeg2video -f mpegts d1.ts
          ffmpeg -v error -f lavfi -i testsrc=d=1:s=64x48  -c:v mpeg2video -f mpegts d2.ts
          printf '#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:1\n#EXT-X-MEDIA-SEQUENCE:0\n#EXTINF:1.0,\nd0.ts\n#EXTINF:1.0,\nd1.ts\n#EXT-X-DISCONTINUITY\n#EXTINF:1.0,\nd2.ts\n#EXT-X-ENDLIST\n' > disc.m3u8
          timeout 60 ../hlsdl/hlsdl -f -o out_disc.ts disc.m3u8
          ffprobe -v error -show_entries format=format_name -of csv=p=0 out_disc.ts | grep -q .
      - name: fixture - TS segments disguised as images (VOD + live)
        run: |
          set -eux
          cd fx
          ffmpeg -v error -f lavfi -i testsrc=d=3:s=64x48 -c:v mpeg2video \
                 -f hls -hls_time 1 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_filename 'img%d.ts' img.m3u8
          # every segment gets an image in front of the TS data (a WEBP or a
          # PNG head, alternating) and an image-like name, as on image CDNs
          for f in $(grep '\.ts$' img.m3u8); do
            n=${f#img}; n=${n%.ts}
            if [ $((n % 2)) -eq 0 ]; then
              printf 'RIFF\042\000\000\000WEBPVP8L\025\000\000\000\057\000\000\000\020\007\020\021\021\210\210\376\007\000' > "dis$n.image"
            else
              printf '\211PNG\r\n\032\n\000\000\000\015IHDR\000\000\000\001\000\000\000\001\010\006\000\000\000\037\025\304\211' > "dis$n.image"
            fi
            cat "$f" >> "dis$n.image"
          done
          sed 's/^img\([0-9]*\)\.ts$/dis\1.image/' img.m3u8 > dis.m3u8
          cat dis.m3u8
          # VOD: the image heads are cut off -> the same bytes as the plain TS
          timeout 60 ../hlsdl/hlsdl -f -o ref_img.ts img.m3u8
          timeout 60 ../hlsdl/hlsdl -f -o out_dis.ts dis.m3u8 2>dis.log
          cat dis.log
          grep -q 'disguised as images' dis.log
          cmp out_dis.ts ref_img.ts
          # live: the same cut in the live writer
          sed '/#EXT-X-ENDLIST/d;/#EXT-X-PLAYLIST-TYPE/d' dis.m3u8 > live_dis.m3u8
          python3 -m http.server 8198 &
          srv=$!
          for _ in $(seq 20); do
            curl -sf -o /dev/null http://127.0.0.1:8198/live_dis.m3u8 && break
            sleep 0.5
          done
          # VOD over HTTP: curl.c used to cut 16 bytes off every PNG-headed
          # segment (and read 16 bytes past the buffer), which left the rest of
          # the PNG head in front of the TS data
          timeout 60 ../hlsdl/hlsdl -f -o out_dis_http.ts "http://127.0.0.1:8198/dis.m3u8"
          cmp out_dis_http.ts ref_img.ts
          # -s 30: start at the first segment (the window is ~3 s), -i 2 ends
          # cleanly after 2 s of media instead of waiting for new segments
          timeout 30 ../hlsdl/hlsdl -f -s 30 -i 2 -e 1 -o out_live_dis.ts "http://127.0.0.1:8198/live_dis.m3u8" || true
          kill $srv 2>/dev/null || true
          ls -l out_live_dis.ts
          test "$(head -c 1 out_live_dis.ts | od -An -tx1 | tr -d ' \n')" = 47
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 out_live_dis.ts | grep -q video
      - name: fixture - TS video + separate audio playlist (A/V merge)
        run: |
          set -eux
          cd fx
          # video-only and audio-only TS playlists; hlsdl -a muxes them into
          # one TS via find_first_ts_packet + merge_packets
          ffmpeg -v error -f lavfi -i testsrc=d=3:s=128x72 -c:v mpeg2video \
                 -f hls -hls_time 1 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_filename 'v%d.ts' vplaylist.m3u8
          ffmpeg -v error -f lavfi -i sine=f=440:d=3 -c:a mp2 \
                 -f hls -hls_time 1 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_filename 'a%d.ts' aplaylist.m3u8
          timeout 60 ../hlsdl/hlsdl -f -a aplaylist.m3u8 -o out_av.ts vplaylist.m3u8
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 out_av.ts | sort -u > av.txt
          cat av.txt
          grep -q video av.txt
          grep -q audio av.txt
      - name: fixture - TS video + packed audio (ID3 + raw AAC) playlist
        run: |
          set -eux
          cd fx
          # Packed audio: raw ADTS frames behind an ID3 tag whose PRIV frame
          # carries the 90 kHz start timestamp. find_first_ts_packet() finds no
          # TS packets in it, so the audio used to be dropped without a word.
          ffmpeg -v error -f lavfi -i sine=f=440:d=3 -c:a aac -ar 44100 -f adts packed_src.aac
          nseg=$(grep -c '\.ts$' vplaylist.m3u8)
          python3 - "$nseg" <<'EOF'
          import struct, sys
          n = int(sys.argv[1])
          data = open('packed_src.aac', 'rb').read()
          frames, i = [], 0
          while i + 7 <= len(data):
              assert data[i] == 0xFF and (data[i + 1] & 0xF0) == 0xF0
              flen = ((data[i + 3] & 3) << 11) | (data[i + 4] << 3) | (data[i + 5] >> 5)
              frames.append(data[i:i + flen])
              i += flen
          per = -(-len(frames) // n)
          owner = b'com.apple.streaming.transportStreamTimestamp\x00'
          lines = ['#EXTM3U', '#EXT-X-VERSION:3', '#EXT-X-TARGETDURATION:1', '#EXT-X-MEDIA-SEQUENCE:0']
          for s in range(n):
              chunk = frames[s * per:(s + 1) * per]
              ts = 126000 + s * per * 1024 * 90000 // 44100
              body = owner + struct.pack('>Q', ts)
              frame = b'PRIV' + struct.pack('>I', len(body)) + b'\x00\x00' + body
              tag = b'ID3\x04\x00\x00' + bytes([0, 0, 0, len(frame)]) + frame
              open('p%d.aac' % s, 'wb').write(tag + b''.join(chunk))
              lines += ['#EXTINF:1.0,', 'p%d.aac' % s]
          lines.append('#EXT-X-ENDLIST')
          open('packed.m3u8', 'w').write('\n'.join(lines) + '\n')
          EOF
          cat packed.m3u8
          timeout 60 ../hlsdl/hlsdl -f -a packed.m3u8 -o out_packed.ts vplaylist.m3u8
          ffprobe -v error -show_entries stream=codec_type,codec_name -of csv=p=0 out_packed.ts | sort -u > packed.txt
          cat packed.txt
          grep -q video packed.txt
          grep -q 'aac,audio' packed.txt
          # the audio frames have to be readable, not only announced in the PMT
          apk=$(ffprobe -v error -select_streams a -count_packets -show_entries stream=nb_read_packets -of csv=p=0 out_packed.ts | head -1)
          test "$apk" -gt 50
      - name: fixture - live TS video + separate audio playlist
        run: |
          set -eux
          cd fx
          # download_live_hls() used to take the video playlist only - a live
          # stream with a separate audio rendition came out without sound
          sed '/#EXT-X-ENDLIST/d;/#EXT-X-PLAYLIST-TYPE/d' vplaylist.m3u8 > vlive.m3u8
          sed '/#EXT-X-ENDLIST/d;/#EXT-X-PLAYLIST-TYPE/d' aplaylist.m3u8 > alive.m3u8
          python3 -m http.server 8202 &
          srv=$!
          for _ in $(seq 20); do
            curl -sf -o /dev/null http://127.0.0.1:8202/vlive.m3u8 && break
            sleep 0.5
          done
          timeout 60 ../hlsdl/hlsdl -f -s 30 -e 1 -a "http://127.0.0.1:8202/alive.m3u8" \
                 -o out_live_av.ts "http://127.0.0.1:8202/vlive.m3u8" 2>live_av.log &
          dl=$!
          for _ in $(seq 40); do
            grep -q 'Downloading part 1' live_av.log && break
            sleep 0.5
          done
          sleep 1
          printf '#EXT-X-ENDLIST\n' >> vlive.m3u8
          printf '#EXT-X-ENDLIST\n' >> alive.m3u8
          rc=0
          wait $dl || rc=$?
          kill $srv 2>/dev/null || true
          cat live_av.log
          test "$rc" -eq 0
          grep -q '"d_t":"live"' live_av.log
          ! grep -q 'No audio for segment' live_av.log
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 out_live_av.ts | sort -u > live_av.txt
          cat live_av.txt
          grep -q video live_av.txt
          grep -q audio live_av.txt
          apk=$(ffprobe -v error -select_streams a -count_packets -show_entries stream=nb_read_packets -of csv=p=0 out_live_av.ts | head -1)
          test "$apk" -gt 20
      - name: fixture - live audio window one segment ahead of the video
        run: |
          set -eux
          cd fx
          # The audio playlist is fetched after the video one; when the live
          # window has moved on by a segment in between, the numbering is
          # still the same: video 0..1, audio 1..2 here. Pairing must stay
          # N <-> N: segment 0 has no audio (it already left the audio
          # window), 1 has. Lining up the live edges instead (N <-> N+1) put
          # every segment one segment out of sync, without any warning.
          python3 - <<'EOF'
          def entries(name):
              head, segs, lines, i = [], [], open(name).read().split('\n'), 0
              while i < len(lines):
                  l = lines[i]
                  if l.startswith('#EXTINF'):
                      segs.append((l, lines[i + 1]))
                      i += 2
                      continue
                  if l and not l.startswith(('#EXT-X-ENDLIST', '#EXT-X-MEDIA-SEQUENCE', '#EXT-X-PLAYLIST-TYPE')):
                      head.append(l)
                  i += 1
              return head, segs
          def write(name, head, seq, segs):
              body = head + ['#EXT-X-MEDIA-SEQUENCE:%d' % seq] + [x for s in segs for x in s]
              open(name, 'w').write('\n'.join(body) + '\n')
          vh, vs = entries('vplaylist.m3u8')
          ah, as_ = entries('aplaylist.m3u8')
          assert len(vs) >= 3 and len(as_) >= 3
          write('vlive_behind.m3u8', vh, 0, vs[0:2])
          write('alive_ahead.m3u8', ah, 1, as_[1:3])
          EOF
          cat vlive_behind.m3u8 alive_ahead.m3u8
          python3 -m http.server 8203 &
          srv=$!
          for _ in $(seq 20); do
            curl -sf -o /dev/null http://127.0.0.1:8203/vlive_behind.m3u8 && break
            sleep 0.5
          done
          timeout 60 ../hlsdl/hlsdl -v -f -s 30 -e 1 -a "http://127.0.0.1:8203/alive_ahead.m3u8" \
                 -o out_ahead.ts "http://127.0.0.1:8203/vlive_behind.m3u8" 2>ahead.log &
          dl=$!
          for _ in $(seq 40); do
            grep -q 'Downloading part 1' ahead.log && break
            sleep 0.5
          done
          sleep 1
          printf '#EXT-X-ENDLIST\n' >> vlive_behind.m3u8
          printf '#EXT-X-ENDLIST\n' >> alive_ahead.m3u8
          rc=0
          wait $dl || rc=$?
          kill $srv 2>/dev/null || true
          cat ahead.log
          test "$rc" -eq 0
          ! grep -q 'numbered apart' ahead.log
          grep -q 'No audio for segment 0 ' ahead.log
          ! grep -q 'No audio for segment 1 ' ahead.log
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 out_ahead.ts | sort -u | grep -q audio
      - name: fixture - live audio that cannot be fetched is given up, the video goes on
        run: |
          set -eux
          cd fx
          # every audio segment answers 404: after 3 misses the audio track
          # (and its refresh thread, mid-download) is stopped, the video is
          # written alone and hlsdl still ends normally at the ENDLIST
          sed 's/^a\([0-9]*\)\.ts$/gone\1.ts/' alive.m3u8 | sed '/#EXT-X-ENDLIST/d' > alive_gone.m3u8
          sed '/#EXT-X-ENDLIST/d' vlive.m3u8 > vlive_gone.m3u8
          cat alive_gone.m3u8
          python3 -m http.server 8204 &
          srv=$!
          for _ in $(seq 20); do
            curl -sf -o /dev/null http://127.0.0.1:8204/vlive_gone.m3u8 && break
            sleep 0.5
          done
          timeout 90 ../hlsdl/hlsdl -f -s 30 -e 1 -a "http://127.0.0.1:8204/alive_gone.m3u8" \
                 -o out_gone.ts "http://127.0.0.1:8204/vlive_gone.m3u8" 2>gone.log &
          dl=$!
          for _ in $(seq 120); do
            grep -q 'keeps failing' gone.log && break
            sleep 0.5
          done
          sleep 1
          printf '#EXT-X-ENDLIST\n' >> vlive_gone.m3u8
          rc=0
          wait $dl || rc=$?
          kill $srv 2>/dev/null || true
          cat gone.log
          test "$rc" -eq 0
          grep -q 'keeps failing' gone.log
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 out_gone.ts | sort -u > gone.txt
          cat gone.txt
          grep -q video gone.txt
          ! grep -q audio gone.txt
      - name: fixture - TS audio with an ID3 tag in front, PIDs changing at a discontinuity
        run: |
          set -eux
          cd fx
          # audio packets over all audio streams (a PID change makes a second
          # one); ffprobe lists a stream once per program too, hence sort -u
          pk() { ffprobe -v error -select_streams a -count_packets -show_entries stream=index,nb_read_packets -of csv=p=0 "$1" | sort -u | awk -F, '{s += $2} END {print s + 0}'; }
          # An ID3 timed-metadata tag in front of TS audio is no packed audio:
          # it must still be merged as TS
          python3 - <<'EOF'
          import struct
          body = b'com.example.meta\x00' + b'x' * 8
          frame = b'PRIV' + struct.pack('>I', len(body)) + b'\x00\x00' + body
          tag = b'ID3\x04\x00\x00' + bytes([0, 0, 0, len(frame)]) + frame
          src = open('aplaylist.m3u8').read()
          for l in src.split('\n'):
              if l.endswith('.ts'):
                  open('id3' + l, 'wb').write(tag + open(l, 'rb').read())
          open('id3a.m3u8', 'w').write('\n'.join(('id3' + l) if l.endswith('.ts') else l for l in src.split('\n')))
          EOF
          timeout 60 ../hlsdl/hlsdl -f -a id3a.m3u8 -o out_id3ts.ts vplaylist.m3u8 2>id3ts.log
          cat id3ts.log
          ! grep -q 'Could not merge' id3ts.log
          test "$(pk out_id3ts.ts)" -eq "$(pk out_av.ts)"
          # After a discontinuity the TS PIDs / PMT change (ad break): the
          # merge has to work its PMT out again, or the audio after it is lost
          ffmpeg -v error -f lavfi -i testsrc=d=1:s=128x72 -c:v mpeg2video \
                 -mpegts_pmt_start_pid 0x1100 -mpegts_start_pid 0x130 -f mpegts vx.ts
          ffmpeg -v error -f lavfi -i sine=f=880:d=1 -c:a mp2 \
                 -mpegts_pmt_start_pid 0x1200 -mpegts_start_pid 0x140 -f mpegts ax.ts
          hdr='#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:1\n#EXT-X-MEDIA-SEQUENCE:0\n'
          { printf "$hdr"; printf '#EXTINF:1.0,\nv0.ts\n#EXT-X-DISCONTINUITY\n#EXTINF:1.0,\nvx.ts\n#EXT-X-ENDLIST\n'; } > vdisc.m3u8
          { printf "$hdr"; printf '#EXTINF:1.0,\na0.ts\n#EXT-X-DISCONTINUITY\n#EXTINF:1.0,\nax.ts\n#EXT-X-ENDLIST\n'; } > adisc.m3u8
          { printf "$hdr"; printf '#EXTINF:1.0,\nv0.ts\n#EXT-X-ENDLIST\n'; } > vone.m3u8
          { printf "$hdr"; printf '#EXTINF:1.0,\na0.ts\n#EXT-X-ENDLIST\n'; } > aone.m3u8
          timeout 60 ../hlsdl/hlsdl -f -a aone.m3u8 -o out_one.ts vone.m3u8
          timeout 60 ../hlsdl/hlsdl -f -a adisc.m3u8 -o out_adisc.ts vdisc.m3u8
          one=$(pk out_one.ts); both=$(pk out_adisc.ts); ax=$(pk ax.ts)
          echo "one=$one both=$both ax=$ax"
          # the audio of the second part is in the file, not just the first
          test "$both" -ge $((one + ax * 3 / 4))
          # Many discontinuities, and the audio PMT layout changes with them
          # (a language descriptor makes its ES_info longer): every re-parse
          # has to start from a clean PMT - stale components used to pile up
          # until hlsdl exited ("Components table to small") or wrote past
          # its buffer.
          ffmpeg -v error -f lavfi -i sine=f=660:d=1 -c:a mp2 -metadata:s:a:0 language=deu \
                 -mpegts_pmt_start_pid 0x1300 -mpegts_start_pid 0x150 -f mpegts al.ts
          {
            printf "$hdr"
            for i in 1 2 3; do
              printf '#EXTINF:1.0,\nv0.ts\n#EXT-X-DISCONTINUITY\n#EXTINF:1.0,\nvx.ts\n#EXT-X-DISCONTINUITY\n'
            done
            printf '#EXTINF:1.0,\nv0.ts\n#EXT-X-ENDLIST\n'
          } > vmany.m3u8
          {
            printf "$hdr"
            for i in 1 2 3; do
              printf '#EXTINF:1.0,\na0.ts\n#EXT-X-DISCONTINUITY\n#EXTINF:1.0,\nal.ts\n#EXT-X-DISCONTINUITY\n'
            done
            printf '#EXTINF:1.0,\na0.ts\n#EXT-X-ENDLIST\n'
          } > amany.m3u8
          timeout 60 ../hlsdl/hlsdl -f -a amany.m3u8 -o out_many.ts vmany.m3u8 2>many.log
          ! grep -q 'Could not merge' many.log
          many=$(pk out_many.ts); al=$(pk al.ts)
          echo "many=$many one=$one al=$al"
          test "$many" -ge $(( (4 * one + 3 * al) * 3 / 4 ))
      - name: fixture - AES-128 with EXT-X-MAP before EXT-X-KEY
        run: |
          set -eux
          cd fx
          ffmpeg -v error -f lavfi -i testsrc=d=2:s=64x48 -c:v libx264 -g 15 \
                 -f hls -hls_time 2 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_type fmp4 -hls_fmp4_init_filename ki.mp4 ki.m3u8
          head -c 16 /dev/urandom > enc.key
          KEYHEX=$(xxd -p -c 32 enc.key)
          IV=000102030405060708090a0b0c0d0e0f
          seg=$(grep -v '^#' ki.m3u8 | head -1)
          openssl aes-128-cbc -e -K "$KEYHEX" -iv "$IV" -in ki.mp4 -out ki.mp4.enc
          openssl aes-128-cbc -e -K "$KEYHEX" -iv "$IV" -in "$seg"  -out seg0.enc
          {
            printf '#EXTM3U\n#EXT-X-VERSION:5\n#EXT-X-TARGETDURATION:2\n#EXT-X-MEDIA-SEQUENCE:0\n#EXT-X-PLAYLIST-TYPE:VOD\n'
            printf '#EXT-X-MAP:URI="ki.mp4.enc"\n'
            printf '#EXT-X-KEY:METHOD=AES-128,URI="enc.key",IV=0x%s\n' "$IV"
            printf '#EXTINF:2.0,\nseg0.enc\n#EXT-X-ENDLIST\n'
          } > mapkey.m3u8
          cat mapkey.m3u8
          timeout 30 ../hlsdl/hlsdl -f -o out_mapkey.mp4 mapkey.m3u8
          # the init segment must come out decrypted (ftyp box), not ciphertext
          dd if=out_mapkey.mp4 bs=1 skip=4 count=4 2>/dev/null | grep -q ftyp
      - name: fixture - AES-128 IV in upper case, IV before URI
        run: |
          set -eux
          cd fx
          # RFC 8216 writes the IV hex digits in upper case and the attributes may
          # come in any order; a wrong IV only breaks the first 16 bytes of each
          # segment, i.e. exactly the ftyp box checked below
          IVU=A1B2C3D4E5F60718293A4B5C6D7E8F90
          openssl aes-128-cbc -e -K "$(xxd -p -c 32 enc.key)" -iv "$IVU" -in ki.mp4 -out ki_u.mp4.enc
          {
            printf '#EXTM3U\n#EXT-X-VERSION:5\n#EXT-X-TARGETDURATION:2\n#EXT-X-MEDIA-SEQUENCE:0\n#EXT-X-PLAYLIST-TYPE:VOD\n'
            printf '#EXT-X-MAP:URI="ki_u.mp4.enc"\n'
            printf '#EXT-X-KEY:METHOD=AES-128,IV=0X%s,URI="enc.key",KEYFORMAT="identity"\n' "$IVU"
            printf '#EXTINF:2.0,\nseg0_u.enc\n#EXT-X-ENDLIST\n'
          } > mapkey_u.m3u8
          seg=$(grep -v '^#' ki.m3u8 | head -1)
          openssl aes-128-cbc -e -K "$(xxd -p -c 32 enc.key)" -iv "$IVU" -in "$seg" -out seg0_u.enc
          cat mapkey_u.m3u8
          timeout 30 ../hlsdl/hlsdl -f -o out_mapkey_u.mp4 mapkey_u.m3u8
          dd if=out_mapkey_u.mp4 bs=1 skip=4 count=4 2>/dev/null | grep -q ftyp
      - name: fixture - key rotation, METHOD=NONE and a key without IV
        run: |
          set -eux
          cd fx
          ffmpeg -v error -f lavfi -i testsrc=d=6:s=64x48 -c:v mpeg2video -g 25 \
                 -f hls -hls_time 1 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_filename 'rk%d.ts' rk_src.m3u8
          test "$(grep -c '\.ts$' rk_src.m3u8)" -ge 4
          head -c 16 /dev/urandom > k1.key
          head -c 16 /dev/urandom > k2.key
          IV2=0F0E0D0C0B0A09080706050403020100
          # segment 1 under k1 with the implicit IV (its media sequence number),
          # segment 3 under k2 with an explicit IV; 0 and 2 are in the clear
          openssl aes-128-cbc -e -K "$(xxd -p -c 32 k1.key)" -iv 00000000000000000000000000000001 -in rk1.ts -out rk1.enc
          openssl aes-128-cbc -e -K "$(xxd -p -c 32 k2.key)" -iv "$IV2" -in rk3.ts -out rk3.enc
          hdr='#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:1\n#EXT-X-MEDIA-SEQUENCE:0\n'
          {
            printf "$hdr"
            printf '#EXTINF:1.0,\nrk0.ts\n#EXTINF:1.0,\nrk1.ts\n#EXTINF:1.0,\nrk2.ts\n#EXTINF:1.0,\nrk3.ts\n#EXT-X-ENDLIST\n'
          } > rk_plain.m3u8
          # the last method used to apply to every segment (rk0 got "decrypted"),
          # and the IV search ran on into the next EXT-X-KEY line (k1 took IV2)
          {
            printf "$hdr"
            printf '#EXTINF:1.0,\nrk0.ts\n'
            printf '#EXT-X-KEY:METHOD=AES-128,URI="k1.key"\n#EXTINF:1.0,\nrk1.enc\n'
            printf '#EXT-X-KEY:METHOD=NONE\n#EXTINF:1.0,\nrk2.ts\n'
            printf '#EXT-X-KEY:METHOD=AES-128,URI="k2.key",IV=0x%s\n#EXTINF:1.0,\nrk3.enc\n' "$IV2"
            printf '#EXT-X-ENDLIST\n'
          } > rk.m3u8
          cat rk.m3u8
          timeout 60 ../hlsdl/hlsdl -f -o ref_rk.ts rk_plain.m3u8
          timeout 60 ../hlsdl/hlsdl -f -o out_rk.ts rk.m3u8
          cmp out_rk.ts ref_rk.ts
      - name: fixture - master playlist with CRLF, a variant without RESOLUTION, no final newline
        run: |
          set -eux
          cd fx
          # CRLF used to leave a \r in the variant URL. The variant list is
          # built in reverse, so -W looks at the one without RESOLUTION first -
          # that used to end the search with "No resolution match found".
          printf '#EXTM3U\r\n#EXT-X-STREAM-INF:BANDWIDTH=200000,RESOLUTION=64x48\r\nrk_plain.m3u8\r\n#EXT-X-STREAM-INF:BANDWIDTH=100000\r\nrk_plain.m3u8\r\n' > crlf_master.m3u8
          timeout 60 ../hlsdl/hlsdl -f -W 100 -o out_crlf.ts crlf_master.m3u8
          cmp out_crlf.ts ref_rk.ts
          # a variant URL on the last line without a newline used to be dropped
          printf '#EXTM3U\n#EXT-X-STREAM-INF:BANDWIDTH=100000\nrk_plain.m3u8' > nonl_master.m3u8
          timeout 60 ../hlsdl/hlsdl -f -b -o out_nonl.ts nonl_master.m3u8
          cmp out_nonl.ts ref_rk.ts
      - name: fixture - live playlist that ends without new segments
        run: |
          set -eux
          cd fx
          printf '#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:1\n#EXT-X-MEDIA-SEQUENCE:0\n#EXTINF:1.0,\nrk0.ts\n#EXTINF:1.0,\nrk1.ts\n' > live_end.m3u8
          { cat live_end.m3u8; printf '#EXT-X-ENDLIST\n'; } > live_end_vod.m3u8
          timeout 60 ../hlsdl/hlsdl -f -o ref_end.ts live_end_vod.m3u8
          python3 -m http.server 8199 &
          srv=$!
          for _ in $(seq 20); do
            curl -sf -o /dev/null http://127.0.0.1:8199/live_end.m3u8 && break
            sleep 0.5
          done
          timeout 30 ../hlsdl/hlsdl -f -s 30 -e 1 -o out_end.ts "http://127.0.0.1:8199/live_end.m3u8" 2>live_end.log &
          dl=$!
          # change the playlist only once hlsdl is through the first window
          for _ in $(seq 40); do
            grep -q 'Downloading part 1' live_end.log && break
            sleep 0.5
          done
          sleep 1
          # the stream ends with no new segment: hlsdl used to wait forever on
          # the empty queue (here: until the timeout kills it, exit 124)
          printf '#EXT-X-ENDLIST\n' >> live_end.m3u8
          rc=0
          wait $dl || rc=$?
          kill $srv 2>/dev/null || true
          test "$rc" -eq 0
          cmp out_end.ts ref_end.ts
      - name: fixture - an unusable key and a full disk fail the download
        run: |
          set -eux
