          timeout 60 ../hlsdl/hlsdl -f -s 30 -e 1 -o out_reset.ts "http://127.0.0.1:8208/live_reset.m3u8" 2>live_reset.log &
          dl=$!
          for _ in $(seq 40); do
            grep -q 'Downloading part 102' live_reset.log && break
            sleep 0.5
          done
          sleep 1
          # the encoder starts over: numbers 0.. - hlsdl used to wait forever,
          # nothing ever got past the old last number 102
          printf "$live"'#EXT-X-MEDIA-SEQUENCE:0\n#EXTINF:1.0,\nrk3.ts\n#EXTINF:1.0,\nrk4.ts\n#EXTINF:1.0,\nrk5.ts\n' > live_reset.m3u8
          for _ in $(seq 40); do
            grep -q 'Downloading part 2$' live_reset.log && break
            sleep 0.5
          done
          printf '#EXT-X-ENDLIST\n' >> live_reset.m3u8
          rc=0
          wait $dl || rc=$?
          kill $srv 2>/dev/null || true
          cat live_reset.log
          test "$rc" -eq 0
          grep -q 'following the restarted stream' live_reset.log
          grep -q 'Downloading part 0$' live_reset.log
          grep -q 'Downloading part 2$' live_reset.log
      - name: fixture - live start no closer to the end than three target durations
        run: |
          set -eux
          cd fx
          printf '#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:1\n#EXT-X-MEDIA-SEQUENCE:0\n#EXTINF:1.0,\nrk0.ts\n#EXTINF:1.0,\nrk1.ts\n#EXTINF:1.0,\nrk2.ts\n#EXTINF:1.0,\nrk3.ts\n#EXTINF:1.0,\nrk4.ts\n#EXTINF:1.0,\nrk5.ts\n' > live_edge.m3u8
          python3 -m http.server 8209 &
          srv=$!
          for _ in $(seq 20); do
            curl -sf -o /dev/null http://127.0.0.1:8209/live_edge.m3u8 && break
            sleep 0.5
          done
          # -s 0 used to start at the very last segment
          timeout 60 ../hlsdl/hlsdl -f -s 0 -e 1 -o out_edge.ts "http://127.0.0.1:8209/live_edge.m3u8" 2>live_edge.log &
          dl=$!
          for _ in $(seq 40); do
            grep -q 'Downloading part' live_edge.log && break
            sleep 0.5
          done
          sleep 1
          printf '#EXT-X-ENDLIST\n' >> live_edge.m3u8
          rc=0
          wait $dl || rc=$?
          kill $srv 2>/dev/null || true
          cat live_edge.log
          test "$rc" -eq 0
          test "$(grep -m1 -o 'Downloading part [0-9]*' live_edge.log)" = "Downloading part 3"
      - name: fixture - EXT-X-DEFINE (NAME/VALUE, QUERYPARAM, IMPORT)
        run: |
          set -eux
          cd fx
          # {$name} references used to be requested literally. The master
          # passes the token of its own URL (QUERYPARAM) and a name (IMPORT) on
          # to the media playlist, which also has a variable of its own in the
          # quoted EXT-X-KEY URI, and an empty one (VALUE="" is valid).
          printf '#EXTM3U\n#EXT-X-VERSION:8\n#EXT-X-DEFINE:NAME="v",VALUE="def_media"\n#EXT-X-DEFINE:NAME="seg",VALUE="rk"\n#EXT-X-DEFINE:QUERYPARAM="tok"\n#EXT-X-STREAM-INF:BANDWIDTH=300000\n{$v}.m3u8?tok={$tok}\n' > def_master.m3u8
          printf '#EXTM3U\n#EXT-X-VERSION:8\n#EXT-X-TARGETDURATION:1\n#EXT-X-MEDIA-SEQUENCE:0\n#EXT-X-DEFINE:IMPORT="seg"\n#EXT-X-DEFINE:QUERYPARAM="tok"\n#EXT-X-DEFINE:NAME="k",VALUE="k1"\n#EXT-X-DEFINE:NAME="e",VALUE=""\n#EXTINF:1.0,\n{$seg}{$e}0.ts?tok={$tok}\n#EXT-X-KEY:METHOD=AES-128,URI="{$k}.key?tok={$tok}"\n#EXTINF:1.0,\n{$seg}1.enc?tok={$tok}\n#EXT-X-ENDLIST\n' > def_media.m3u8
          python3 -m http.server 8210 2>def_srv.log &
          srv=$!
          for _ in $(seq 20); do
            curl -sf -o /dev/null http://127.0.0.1:8210/def_master.m3u8 && break
            sleep 0.5
          done
          rc=0
          timeout 30 ../hlsdl/hlsdl -b -f -o out_def.ts "http://127.0.0.1:8210/def_master.m3u8?tok=abc123" < /dev/null || rc=$?
          kill $srv 2>/dev/null || true
          cat def_srv.log
          test "$rc" -eq 0
          # rk0 in the clear + rk1 decrypted with k1.key
          cmp out_def.ts ref_vod_end.ts
          grep -q 'GET /def_media.m3u8?tok=abc123 ' def_srv.log
          grep -q 'GET /rk0.ts?tok=abc123 ' def_srv.log
          grep -q 'GET /k1.key?tok=abc123 ' def_srv.log
          grep -q 'GET /rk1.enc?tok=abc123 ' def_srv.log
          ! grep -qiE '\{\$|%7B%24' def_srv.log
      - name: fixture - EXT-X-DEFINE QUERYPARAM on live refreshes behind a redirect
        run: |
          set -eux
          cd fx
          # the playlist URL carries the token, the server redirects to a path
          # without query: the refresh used to read QUERYPARAM from the
          # redirect target and request {$tok} literally from then on
          printf '#EXTM3U\n#EXT-X-VERSION:8\n#EXT-X-TARGETDURATION:1\n#EXT-X-MEDIA-SEQUENCE:0\n#EXT-X-DEFINE:QUERYPARAM="tok"\n#EXTINF:1.0,\nrk0.ts?tok={$tok}\n#EXTINF:1.0,\nrk1.ts?tok={$tok}\n' > lq_real.m3u8
          python3 - <<'EOF' 2>lq_srv.log &
          import http.server
          class H(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  if self.path.startswith('/lq.m3u8'):
                      self.send_response(302)
                      self.send_header('Location', '/lq_real.m3u8')
                      self.end_headers()
                      return
                  return super().do_GET()
          http.server.ThreadingHTTPServer(('127.0.0.1', 8211), H).serve_forever()
          EOF
          srv=$!
          for _ in $(seq 20); do
            curl -sf -o /dev/null http://127.0.0.1:8211/lq_real.m3u8 && break
            sleep 0.5
          done
          timeout 60 ../hlsdl/hlsdl -f -s 30 -e 1 -o out_lq.ts "http://127.0.0.1:8211/lq.m3u8?tok=xyz" 2>lq.log &
          dl=$!
          for _ in $(seq 40); do
            grep -q 'Downloading part 1' lq.log && break
            sleep 0.5
          done
          sleep 1
          printf '#EXTINF:1.0,\nrk2.ts?tok={$tok}\n' >> lq_real.m3u8
          for _ in $(seq 40); do
            grep -q 'Downloading part 2' lq.log && break
            sleep 0.5
          done
          printf '#EXT-X-ENDLIST\n' >> lq_real.m3u8
          rc=0
          wait $dl || rc=$?
          kill $srv 2>/dev/null || true
          cat lq.log lq_srv.log
          test "$rc" -eq 0
          grep -q 'GET /rk2.ts?tok=xyz ' lq_srv.log
          ! grep -qiE '\{\$|%7B%24' lq_srv.log
      - name: fixture - live restart with old segments still queued (404 now), separate audio
        run: |
          set -eux
          cd fx
          # old stream 100.. (slow server: segments 101, 102 are still queued
          # when the restart is seen), new stream 0.. under new names; the old
          # names answer 404 from then on. The queued old segments used to be
          # retried -w times each, and old audio blocked the pairing.
          for i in 0 1 2; do cp "v$i.ts" "nv$i.ts"; cp "a$i.ts" "na$i.ts"; done
          hdr='#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:1\n'
          printf "$hdr"'#EXT-X-MEDIA-SEQUENCE:100\n#EXTINF:1.0,\nv0.ts\n#EXTINF:1.0,\nv1.ts\n#EXTINF:1.0,\nv2.ts\n' > rsv.m3u8
          printf "$hdr"'#EXT-X-MEDIA-SEQUENCE:100\n#EXTINF:1.0,\na0.ts\n#EXTINF:1.0,\na1.ts\n#EXTINF:1.0,\na2.ts\n' > rsa.m3u8
          rm -f restart_phase2
          python3 - <<'EOF' 2>rs_srv.log &
          import http.server, os, time
          OLD = {'/v0.ts', '/v1.ts', '/v2.ts', '/a0.ts', '/a1.ts', '/a2.ts'}
          class H(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  phase2 = os.path.exists('restart_phase2')
                  if self.path.endswith('.ts'):
                      if phase2 and self.path in OLD:
                          self.send_error(404)
                          return
                      if not phase2:
                          time.sleep(1.5)
                  return super().do_GET()
          http.server.ThreadingHTTPServer(('127.0.0.1', 8212), H).serve_forever()
          EOF
          srv=$!
          for _ in $(seq 20); do
            curl -sf -o /dev/null http://127.0.0.1:8212/rsv.m3u8 && break
            sleep 0.5
          done
          timeout 90 ../hlsdl/hlsdl -f -s 30 -e 1 -a "http://127.0.0.1:8212/rsa.m3u8" \
                 -o out_rs.ts "http://127.0.0.1:8212/rsv.m3u8" 2>rs.log &
          dl=$!
          for _ in $(seq 40); do
            grep -q 'Downloading part 100' rs.log && break
            sleep 0.5
          done
          touch restart_phase2
          printf "$hdr"'#EXT-X-MEDIA-SEQUENCE:0\n#EXTINF:1.0,\nnv0.ts\n#EXTINF:1.0,\nnv1.ts\n#EXTINF:1.0,\nnv2.ts\n' > rsv.m3u8
          printf "$hdr"'#EXT-X-MEDIA-SEQUENCE:0\n#EXTINF:1.0,\nna0.ts\n#EXTINF:1.0,\nna1.ts\n#EXTINF:1.0,\nna2.ts\n' > rsa.m3u8
          for _ in $(seq 60); do
            grep -q 'Downloading part 2$' rs.log && break
            sleep 0.5
          done
          printf '#EXT-X-ENDLIST\n' >> rsv.m3u8
          printf '#EXT-X-ENDLIST\n' >> rsa.m3u8
          rc=0
          wait $dl || rc=$?
          kill $srv 2>/dev/null || true
          cat rs.log
          test "$rc" -eq 0
          test "$(grep -c 'following the restarted stream' rs.log)" -eq 2
          # neither the queued old segments nor the one being fetched at the restart
          ! grep -qE 'Live retry segment 10[012]' rs.log
          ! grep -q 'Downloading part 101' rs.log
          grep -q 'Downloading part 0$' rs.log
          ! grep -q 'keeps failing' rs.log
          # every segment of the new stream has its audio
          ! grep -qE 'No audio for segment [012] ' rs.log
          apk=$(ffprobe -v error -select_streams a -count_packets -show_entries stream=nb_read_packets -of csv=p=0 out_rs.ts | head -1 | cut -d, -f1)
          test "$apk" -gt 20
      - name: fixture - EXT-X-GAP in the fMP4 A/V mux
        run: |
          set -eux
          cd fx
          seg2=$(grep '\.m4s$' fvid.m3u8 | sed -n 2p)
          awk -v s="$seg2" '$0 == s { print "#EXT-X-GAP" } { print }' fvid.m3u8 > fvid_gap.m3u8
          # the #EXTINF line belongs before the gap marker's segment - move the tag up
          python3 - <<'EOF'
          lines = open('fvid_gap.m3u8').read().split('\n')
          out = []
          for i, l in enumerate(lines):
              if l == '#EXT-X-GAP' and out and out[-1].startswith('#EXTINF'):
                  out.insert(len(out) - 1, l)
              else:
                  out.append(l)
          open('fvid_gap.m3u8', 'w').write('\n'.join(out))
          EOF
          cat fvid_gap.m3u8
          chmod 000 "$seg2"
          rc=0
          timeout 30 ../hlsdl/hlsdl -f -a faud.m3u8 -o fav_gap.mp4 fvid_gap.m3u8 2>fav_gap.log || rc=$?
          chmod 644 "$seg2"
          cat fav_gap.log
          test "$rc" -eq 0
          grep -q 'gap (EXT-X-GAP)' fav_gap.log
          vpk=$(ffprobe -v error -select_streams v -count_packets -show_entries stream=nb_read_packets -of csv=p=0 fav_gap.mp4 | head -1 | cut -d, -f1)
          apk=$(ffprobe -v error -select_streams a -count_packets -show_entries stream=nb_read_packets -of csv=p=0 fav_gap.mp4 | head -1 | cut -d, -f1)
          test "$vpk" -eq 100
          test "$apk" -ge 280


  # ---------------------------------------------------------- e2isubparser
  # Old C (VLC / ffmpeg snippets from ~2015). Goal: it links into a loadable
  # module and parses SRT + TTML (the TTML path goes through Expat).
  e2isubparser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: install python dev headers
        run: sudo apt-get update && sudo apt-get -y install python3-dev
      - name: make
        run: make -C e2isubparser CFLAGS="-w"
      - name: parse SRT and TTML (exercises Expat)
        working-directory: e2isubparser
        env:
          # abort + report on any heap corruption, so the huge-cue test below
          # fails loudly if the markup buffer ever overflows again
          MALLOC_CHECK_: "3"
        run: |
          python3 - <<'PY'
          import _subparser
          print("version:", _subparser.version())

          srt = "1\n00:00:01,000 --> 00:00:02,000\nHello world\n\n"
          r = _subparser.parse(srt, 0, 1, 1, 12, 138)
          print("srt:", r)
          assert r, "SRT parse returned nothing"

          ttml = (
              '<?xml version="1.0" encoding="UTF-8"?>'
              '<tt xmlns="http://www.w3.org/ns/ttml">'
              '<body><div>'
              '<p begin="00:00:01.000" end="00:00:03.000">Ampersand &amp; entity</p>'
              '<p begin="00:00:04.000" end="00:00:06.000">second cue</p>'
              '</div></body></tt>'
          )
          r = _subparser.parse(ttml, 0, 1, 1, 12, 138)
          print("ttml:", r)
          assert r, "TTML parse returned nothing"

          # a single cue far longer than the internal markup buffer, with
          # lots of <b>/<font> tags and unterminated '<' - must not overflow
          huge = ("1\n00:00:01,000 --> 00:00:05,000\n"
                  + ("<b>x</b> <font size=\"20\">y</font> z <<<< " * 400)
                  + "\n\n")
          r = _subparser.parse(huge, 0, 1, 1, 12, 138)
          print("huge cue len:", len(r["list"][0]["text"]))
          assert r["list"], "huge SRT parse returned nothing"
          assert len(r["list"][0]["text"]) < 4096, "markup buffer not bounded"

          # a cue longer than the markup buffer, cut inside a multi-byte
          # character, must still give a valid list (no NULL entry / error)
          umlaut = "1\n00:00:01,000 --> 00:00:05,000\n" + ("\u00e4" * 3000) + "\n\n"
          r = _subparser.parse(umlaut, 0, 1, 1, 12, 138)
          assert r["list"] and isinstance(r["list"][0]["text"], str), "cut UTF-8 cue"

          # a cue without end time: the last one must end after it starts
          mdvd = "{25}{}first\n{50}{}last cue\n"
          r = _subparser.parse(mdvd, 40000, 1, 1, 12, 138)
          print("microdvd:", r)
          last = r["list"][-1]
          assert last["end"] > last["start"], "last cue ends before it starts"
          PY
      - name: parsers never loop forever
        working-directory: e2isubparser
        run: |
          python3 - <<'PY'
          import multiprocessing as mp

          def work(s, q):
              import _subparser
              q.put(_subparser.parse(s, 0, 1, 1, 12, 138))

          def parse_with_timeout(s, sec=10):
              q = mp.Queue()
              p = mp.Process(target=work, args=(s, q))
              p.start()
              p.join(sec)
              if p.is_alive():
                  p.terminate()
                  raise SystemExit("parser did not finish within %d s: %r" % (sec, s[:80]))
              return q.get(timeout=5)

          # several SAMI SYNC entries on one line used to repeat the first one forever
          sami = "<SAMI><BODY><SYNC Start=1000><P>Hi<SYNC Start=2000><P>there<SYNC Start=3000><P>&nbsp;</BODY></SAMI>"
          r = parse_with_timeout(sami)
          print("sami:", r)
          assert [c["start"] for c in r["list"]][:2] == [1000, 2000], "SAMI entries"

          # malformed SRT-like input found by fuzzing (hung before the fix)
          fuzz = (":199]:99:,799 -->: -1:00:00,&000\nx\n\n2001-> m3> \n\n:00:01,000 \n0:00:1-> > \n\n\n"
                  "9,9[,99 --> -1:00:00,&00\nx\n\n26\n00:00:01,000 \n00:00:\\01-> m3> \n\n")
          parse_with_timeout(fuzz)
          print("fuzz case finished")

  # ----------------------------------------------------------- cmdwrap / lsdir
  small-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: make
        run: |
          set -eux
          make -C cmdwrap
          make -C lsdir
          ./lsdir/lsdir . >/dev/null
          ./lsdir/lsdir --version | grep -qE '^lsdir v[0-9]'
      - name: README component-version badges match the sources
        run: |
          set -eu
          check() {
            grep -qF "img.shields.io/badge/$1-$2-blue" README.md \
              || { echo "README 'Component versions' badge for $1 is not $2" >&2; exit 1; }
          }
          check hlsdl        "$(grep -oE 'hlsdl v[0-9.]+' hlsdl/src/misc.c | head -1 | sed 's/hlsdl //')"
          check e2isubparser "$(grep -oE '"[0-9]+\.[0-9]+"' e2isubparser/src/subparsermodule.c | head -1 | tr -d '"')"
          check lsdir        "$(grep -oE '"[0-9.]+"' lsdir/src/lsdir.c | head -1 | tr -d '"')"
          check cmdwrap      "$(grep -oE 'Version: [0-9.]+' cmdwrap/src/cmdwrap.c | grep -oE '[0-9.]+')"
          check f4mdump      "$(grep -oE 'F4MDump v[0-9.]+' f4mdump/src/main.cpp | sed 's/F4MDump //')"
          check e2ipow       "$(grep -oE 'E2IPOW_VERSION "[0-9.]+"' e2ipow/src/e2ipow.c | grep -oE '[0-9.]+')"
          check exteplayer3png "$(grep -oE 'EXTEPLAYER3PNG_VERSION "[0-9.]+"' exteplayer3png/src/png.c | grep -oE '[0-9.]+')"

  # --------------------------------------------------------------- cppcheck
  # Static analysis of the C we maintain (not the vendored expat / vlc /
  # ffmpeg / librtmp trees). Informational - it does not fail the build.
  cppcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: install cppcheck
        run: sudo apt-get update && sudo apt-get -y install cppcheck
      - name: cppcheck
        run: |
          cppcheck --enable=warning,portability --inline-suppr --std=c11 \
                   --suppress=missingIncludeSystem --suppress=missingInclude \
                   hlsdl/src cmdwrap/src lsdir/src e2ipow/src exteplayer3png/src

  # ---------------------------------------------------------------- f4mdump
  # f4mdump has no build file in the repo: build it from the same sources and
  # with the same compiler flags as the OE recipe
  # (enigma2-plugin-extensions-e2iplayer-deps.bb, S5/S6), libraries last for
  # the as-needed linker. Then let it list the qualities of a local HDS
  # manifest - that runs the vendored TinyXML-2 on a real document.
  f4mdump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: install build deps
        run: sudo apt-get update && sudo apt-get -y install libssl-dev zlib1g-dev
      - name: build
        working-directory: f4mdump
        run: |
          set -eux
          # compiler errors also go out as annotations (readable without the log)
          report() { grep -E 'error|undefined reference' build.log | head -n 30 | sed 's/^/::error::/'; exit 1; }
          gcc ext/librtmp/amf.c ext/librtmp/hashswf.c ext/librtmp/log.c \
              ext/librtmp/parseurl.c ext/librtmp/rtmp.c \
              -c -fdata-sections -ffunction-sections -Os \
              -Wno-incompatible-pointer-types -Iext/librtmp > build.log 2>&1 || report
          g++ src/b64.c src/F4mDownloader.cpp src/F4mProcessor.cpp \
              src/ManifestParser.cpp src/RTMPTypes.cpp src/RTMPWrapper.cpp \
              src/SimpleFunctions.cpp src/StreamReader.cpp src/StringHelper.cpp \
              src/UdsDownloader.cpp src/console.cpp src/main.cpp src/parser.cpp \
              src/tinyxml2.cpp \
              -Os -Wno-narrowing -std=c++0x -Iinc -Iext -Iext/librtmp \
              *.o -o f4mdump -lssl -lcrypto -lz > build.log 2>&1 || report
          # printInf() writes to stderr
          ./f4mdump 2>&1 | grep -qE '^F4MDump v[0-9]'
      - name: list qualities of a local HDS manifest
        working-directory: f4mdump
        run: |
          set -eux
          mkdir -p /tmp/hds
          cat > /tmp/hds/manifest.f4m <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest xmlns="http://ns.adobe.com/f4m/1.0">
            <baseURL>http://127.0.0.1:8765</baseURL>
            <bootstrapInfo profile="named" id="boot_low">AAAAAA==</bootstrapInfo>
            <bootstrapInfo profile="named" id="boot_high">AAAAAA==</bootstrapInfo>
            <media streamId="high" url="high" bitrate="1500" bootstrapInfoId="boot_high"/>
            <media streamId="low" url="low" bitrate="500" bootstrapInfoId="boot_low"/>
          </manifest>
          EOF
          (cd /tmp/hds && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8765/manifest.f4m >/dev/null && break; sleep 0.5; done
          out=$(./f4mdump "wget -q" "http://127.0.0.1:8765/manifest.f4m" 2>&1)
          echo "$out"
          echo "$out" | grep -qF '"qualities":[500, 1500]'

  # ----------------------------------------------------------------- e2ipow
  # Built like the OE recipe (S7). The expected byse results come from
  # E2iPlayer's scripts/bysepow.py (the Python solver the binary replaces):
  # same first solution and the same number of tried hashes.
  e2ipow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: build (recipe flags)
        working-directory: e2ipow
        run: |
          set -eux
          gcc src/e2ipow.c -O2 -Wall -Wextra -Werror -o e2ipow
          ./e2ipow --version | grep -qE '^e2ipow [0-9]'
          ./e2ipow --list | grep -qx byse
          make
      - name: byse results match scripts/bysepow.py
        working-directory: e2ipow
        run: |
          set -eu
          check() {
            out=$(./e2ipow byse "$1" "$2" "$3" "$4" 60)
            echo "$* -> $out"
            test "$out" = "$5" || { echo "::error::e2ipow byse $1 $2 $3 $4: got $out, expected $5"; exit 1; }
          }
          check e2iplayer-ci-0123456789abcdef 8 0 1 '{"solution": "59", "hashes": 60}'
          check e2iplayer-ci-0123456789abcdef 10 2 3 '{"solution": "59", "hashes": 20}'
          check 3f9c1a7be05d4e21 12 0 1 '{"solution": "8380", "hashes": 8381}'
          check 3f9c1a7be05d4e21 12 1 2 '{"solution": "15201", "hashes": 7601}'
          check x 0 0 1 '{"solution": "0", "hashes": 0}'
      - name: time limit, bad arguments, unknown algorithm
        working-directory: e2ipow
        run: |
          set -eu
          rc=0; ./e2ipow byse abc 64 0 1 1 > out.txt || rc=$?
          cat out.txt
          test $rc -eq 3
          grep -qF '"solution": null' out.txt
          rc=0; ./e2ipow byse abc 8 -1 1 5 || rc=$?; test $rc -eq 2
          rc=0; ./e2ipow byse abc 8 0 1 || rc=$?; test $rc -eq 2
          rc=0; ./e2ipow nosuch abc 8 0 1 5 || rc=$?; test $rc -eq 2
          rc=0; ./e2ipow || rc=$?; test $rc -eq 2
          time ./e2ipow byse 3f9c1a7be05d4e21 16 0 1 60

  # ---------------------------------------------------------- exteplayer3png
  # Built like the OE recipe (S8), then loaded the way exteplayer3 does it:
  # dlopen("exteplayer3png.so") + dlsym("SaveRGBAImage").
  exteplayer3png:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: install build deps
        run: sudo apt-get update && sudo apt-get -y install libpng-dev python3-pil
      - name: build (recipe flags)
        working-directory: exteplayer3png
        run: |
          set -eux
          gcc src/png.c -shared -fPIC -O2 -Wall -Wextra -Wno-clobbered -Werror -Wl,-z,defs -lpng -o exteplayer3png.so
          nm -D --defined-only exteplayer3png.so | grep -qw SaveRGBAImage
          make clean && make
      - name: write a PNG through dlopen
        working-directory: exteplayer3png
        run: |
          set -eux
          cat > loader.c <<'CEOF'
          #include <dlfcn.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <time.h>
          int main(void)
          {
              int (*save)(const char *, const unsigned char *, int, int);
              unsigned char px[2 * 3 * 4];
              unsigned char *sub;
              int i, y, w = 1920, hh = 200;
              clock_t t;
              void *h = dlopen("exteplayer3png.so", RTLD_LAZY);
              if (!h) { fprintf(stderr, "%s\n", dlerror()); return 1; }
              *(void **)(&save) = dlsym(h, "SaveRGBAImage");
              if (!save) return 1;
              for (i = 0; i < (int)sizeof(px); i++) px[i] = (unsigned char)(i * 10);
              if (save("out.png", px, 3, 2) != 0) return 2;
              if (save("/nonexistent/dir/x.png", px, 3, 2) != -1) return 3;
              if (save("bad.png", px, 0, 2) != -1) return 4;
              if (save("bad.png", px, 1000001, 1) != -1) return 5;
              /* a subtitle-like picture: transparent with two opaque text bars */
              sub = calloc((size_t)w * hh, 4);
              if (!sub) return 6;
              for (y = 40; y < 160; y++)
                  if (y < 90 || y > 110)
                      memset(sub + ((size_t)y * w + 300) * 4, 0xff, (size_t)(w - 600) * 4);
              t = clock();
              for (i = 0; i < 50; i++)
                  if (save("sub.png", sub, w, hh) != 0) return 7;
              printf("1920x200 subtitle: %.2f ms per picture\n", (clock() - t) * 1000.0 / CLOCKS_PER_SEC / 50);
              free(sub);
              return 0;
          }
          CEOF
          gcc loader.c -o loader -ldl
          # stderr is exteplayer3's message channel: nothing may be printed on success
          LD_LIBRARY_PATH=. ./loader 2> err.txt
          cat err.txt
          test ! -s err.txt
          test ! -e bad.png
          ls -l sub.png
          python3 - <<'PEOF'
          from PIL import Image
          im = Image.open("out.png")
          assert im.mode == "RGBA" and im.size == (3, 2), (im.mode, im.size)
          assert list(im.tobytes()) == [i * 10 for i in range(24)], list(im.tobytes())
          sub = Image.open("sub.png")
          assert sub.size == (1920, 200) and sub.getpixel((0, 0)) == (0, 0, 0, 0) and sub.getpixel((960, 50)) == (255, 255, 255, 255)
          print("PNG ok")
          PEOF
