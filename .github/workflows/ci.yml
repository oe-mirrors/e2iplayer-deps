      # ---- v0.37: HLS 2nd edition (draft-pantos-hls-rfc8216bis) fixes ----
      - name: fixture - fMP4 video + fMP4 audio rendition muxed into one file (master, -a)
        run: |
          set -eux
          cd fx
          # both encodes start with track_ID 1 - the audio has to be renumbered
          ffmpeg -v error -f lavfi -i testsrc=d=6:s=128x72:r=25 -c:v libx264 -g 25 \
                 -f hls -hls_time 2 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_type fmp4 -hls_fmp4_init_filename fvinit.mp4 \
                 -hls_segment_filename 'fv%d.m4s' fvid.m3u8
          ffmpeg -v error -f lavfi -i sine=f=440:d=6 -c:a aac -ar 48000 \
                 -f hls -hls_time 2 -hls_list_size 0 -hls_playlist_type vod \
                 -hls_segment_type fmp4 -hls_fmp4_init_filename fainit.mp4 \
                 -hls_segment_filename 'fa%d.m4s' faud.m3u8
          # URI first and no DEFAULT=YES: the rendition used to be ignored
          # (hlsdl only knew "#EXT-X-MEDIA:TYPE=AUDIO,")
          printf '#EXTM3U\n#EXT-X-MEDIA:URI="faud.m3u8",TYPE=AUDIO,GROUP-ID="aud",NAME="English",LANGUAGE="en"\n#EXT-X-STREAM-INF:BANDWIDTH=500000,CODECS="avc1.42c00d,mp4a.40.2",AUDIO="aud"\nfvid.m3u8\n' > fav_master.m3u8
          timeout 60 ../hlsdl/hlsdl -b -f -o fav.mp4 fav_master.m3u8 < /dev/null 2>fav.log
          cat fav.log
          ! grep -q 'fmp4-alt-audio' fav.log
          dd if=fav.mp4 bs=1 skip=4 count=4 2>/dev/null | grep -q ftyp
          test "$(grep -a -o ftyp fav.mp4 | wc -l)" -eq 1
          ffprobe -v error -show_entries stream=index,codec_type,codec_name -of csv=p=0 fav.mp4 > fav.txt
          cat fav.txt
          grep -q 'h264,video' fav.txt
          grep -q 'aac,audio' fav.txt
          vpk=$(ffprobe -v error -select_streams v -count_packets -show_entries stream=nb_read_packets -of csv=p=0 fav.mp4 | head -1 | cut -d, -f1)
          apk=$(ffprobe -v error -select_streams a -count_packets -show_entries stream=nb_read_packets -of csv=p=0 fav.mp4 | head -1 | cut -d, -f1)
          test "$vpk" -eq 150
          test "$apk" -ge 280
          # decodes cleanly, both tracks run the full 6 s
          ffmpeg -v error -i fav.mp4 -f null - 2>fav_dec.log
          test ! -s fav_dec.log
          adur=$(ffprobe -v error -select_streams a -show_entries stream=duration -of csv=p=0 fav.mp4 | cut -d, -f1 | cut -d. -f1)
          test "${adur:-0}" -ge 5
          # the same through -a
          timeout 60 ../hlsdl/hlsdl -f -a faud.m3u8 -o fav_a.mp4 fvid.m3u8
          cmp fav.mp4 fav_a.mp4
