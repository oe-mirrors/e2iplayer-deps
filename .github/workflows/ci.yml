          printf '#EXTM3U\n#EXT-X-MEDIA:TYPE=AUDIO,GROUP-ID="a",NAME="Original",DEFAULT=YES\n#EXT-X-MEDIA:TYPE=AUDIO,GROUP-ID="a",NAME="Audiodeskription",URI="aplaylist.m3u8"\n#EXT-X-STREAM-INF:BANDWIDTH=300000,AUDIO="a"\nvplaylist.m3u8\n' > sel_mux.m3u8
          timeout 60 ../hlsdl/hlsdl -v -b -f -o out_sel_mux.ts sel_mux.m3u8 < /dev/null 2>sel_mux.log
          grep -q '"Original" is part of the variant' sel_mux.log
