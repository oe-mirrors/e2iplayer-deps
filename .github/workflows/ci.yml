          head -c 15 /dev/urandom > short.key
          printf '#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:1\n#EXT-X-MEDIA-SEQUENCE:0\n#EXT-X-KEY:METHOD=AES-128,URI="short.key"\n#EXTINF:1.0,\nrk1.enc\n#EXT-X-ENDLIST\n' > badkey.m3u8
